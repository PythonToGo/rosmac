name: nav2-diffbot
description: "Nav2 mobile navigation (Gazebo diffbot + gpu_lidar + SLAM, /navigate_to_pose from the Mac)"
vm_apt:
  - ros-humble-navigation2
  - ros-humble-nav2-bringup
# Sending /navigate_to_pose goals from the Mac needs the msg package in the Mac
# conda env too (without it the goal fails silently as "server not available" — E.20).
mac_env_pkgs:
  - ros-humble-nav2-msgs
vm_env: {}
# No scoping — the full nav2 stack works from the Mac over the default bridge (S0
# measured). Earlier failures were stale bridge routes after a stack restart
# (KI-17); `rosmac sim` resets the bridge session on start to clear them (no
# scoping needed, KI-30 correction).
launch:
  cmd: "ros2 launch ~/rosmac-presets/nav2-diffbot/nav2-diffbot.launch.py"
foxglove_layout: nav2.json
# health=/scan (N1: SLAM /map is a 0x0 latch until ~0.2 m of motion, so unusable).
# timeout = N1 ready 17s + nav2 staggered start (+10s) headroom → 60s to be safe.
health_topics:
  - { name: /scan, timeout: 60 }
