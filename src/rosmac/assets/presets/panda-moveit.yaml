name: panda-moveit
description: "Panda 팔 + MoveIt move_group (RViz 없음, Foxglove 시각화)"
vm_apt:
  - ros-humble-moveit
  - ros-humble-moveit-resources
vm_env: {}
launch:
  # 후보 1 (phase2 2.3) — 실측 후 확정/교체하고 phase2-results.md에 기록할 것
  cmd: "ros2 launch moveit_resources_panda_moveit_config demo.launch.py use_rviz:=false"
foxglove_layout: panda.json
health_topics:
  - { name: /joint_states, timeout: 30 }
  - { name: /monitored_planning_scene, timeout: 45 }
