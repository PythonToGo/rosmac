name: panda-moveit
description: "Panda arm + MoveIt move_group (headless, Foxglove visualization)"
vm_apt:
  - ros-humble-moveit
  - ros-humble-moveit-resources
  - ros-humble-ros2-control
  - ros-humble-ros2-controllers
vm_env: {}
launch:
  # Measured (P2.3): the apt demo.launch.py can't disable rviz (rviz_tutorial is
  # just a config choice), so use the bundled headless launch with only rviz/db
  # removed (appendix C pattern; config otherwise identical to upstream).
  cmd: "ros2 launch ~/rosmac-presets/panda-moveit/demo_headless.launch.py"
foxglove_layout: panda.json
# Timeouts assume a cold VM boot (P2.7 measured: warm ~15s, cold ~40s + discovery)
health_topics:
  - { name: /joint_states, timeout: 90 }
  - { name: /monitored_planning_scene, timeout: 60 }
