[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosmac"
dynamic = ["version"]  # 단일 소스: src/rosmac/__init__.py __version__ (P5.1, D12)
description = "One-command ROS2 Humble dev environment for Apple Silicon Macs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Taeyoung Kim" }]
keywords = ["ros2", "robotics", "macos", "apple-silicon", "robostack", "zenoh", "lima"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.urls]
Repository = "https://github.com/PythonToGo/rosmac"
Issues = "https://github.com/PythonToGo/rosmac/issues"
Changelog = "https://github.com/PythonToGo/rosmac/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# ruff/mypy는 정확 핀 — 도구 메이저 업이 lint/format/type 기준을 조용히 바꿔
# CI·로컬이 어긋나는 드리프트 방지 (P5.1 실측 후 P5.4에서 고정 결정)
dev = ["pytest>=8", "ruff==0.15.20", "mypy==2.2.0", "types-PyYAML"]

[project.scripts]
rosmac = "rosmac.cli:main"  # exit code 규약·에러 패널의 단일 지점 (P5.2)

[tool.hatch.version]
path = "src/rosmac/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rosmac"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]   # e2e는 명시 실행: pytest tests/e2e -m e2e
markers = ["e2e: requires real VM"]

[tool.mypy]
python_version = "3.11"
packages = ["rosmac"]
mypy_path = "src"
