[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosmac"
dynamic = ["version"]  # single source: src/rosmac/__init__.py __version__ (P5.1, D12)
description = "One-command ROS2 Humble dev environment for Apple Silicon Macs"
readme = "README.md"
license = { text = "MIT" }
# MIT for rosmac itself; bundled sim presets are Apache-2.0 / BSD-3-Clause
# derivatives (see THIRD-PARTY-NOTICES.md) — ship all of it in dist-info/licenses/
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Taeyoung Kim" }]
keywords = ["ros2", "robotics", "macos", "apple-silicon", "robostack", "zenoh", "lima"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/PythonToGo/rosmac"
Repository = "https://github.com/PythonToGo/rosmac"
Issues = "https://github.com/PythonToGo/rosmac/issues"
Changelog = "https://github.com/PythonToGo/rosmac/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# ruff/mypy pinned exactly — a tool major bump silently shifts the lint/format/type
# baseline and drifts CI apart from local (measured in P5.1, pinned in P5.4)
dev = ["pytest>=8", "ruff==0.15.20", "mypy==2.2.0", "types-PyYAML"]

[project.scripts]
rosmac = "rosmac.cli:main"  # single point for the exit-code contract and error panels (P5.2)

[tool.hatch.version]
path = "src/rosmac/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rosmac"]
exclude = ["**/__pycache__", "**/*.pyc"]  # keep compiled preset launch files out of the wheel

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]   # e2e runs only explicitly: pytest tests/e2e -m e2e
markers = ["e2e: requires real VM"]

[tool.mypy]
python_version = "3.11"
packages = ["rosmac"]
mypy_path = "src"
