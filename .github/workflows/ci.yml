# On every PR/push: lint + format + type + unit + install smoke (P5.4)
# E2E (needs a VM) is not here — depending on e2e-probe.yml findings it may stay local-only
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" } # supported floor
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-14, python: "3.12" } # the actual target (arm64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (editable + dev tools)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Format check
        run: python -m ruff format --check src tests
      - name: Type check
        run: python -m mypy
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: CLI smoke
        run: |
          rosmac --version
          rosmac --help
