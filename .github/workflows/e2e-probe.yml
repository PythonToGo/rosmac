# P5.4 ③ probe: can a Lima VM boot on a GitHub macOS runner (nested virtualization)?
# One-shot manual trigger — record the result in phase5-results.md;
# if it can't, E2E is confirmed local-only
name: e2e-runner-probe
on: workflow_dispatch

jobs:
  lima-probe:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Runner virtualization capability
        run: |
          sw_vers
          sysctl kern.hv_support || true
          sysctl -n machdep.cpu.brand_string || true
      - name: Install lima
        run: brew install lima
      - name: Try starting a minimal VM
        run: |
          set -x
          limactl start --name=probe template://default --tty=false || echo "::warning::limactl start failed (exit $?)"
          limactl list
      - name: Shell into VM if it started
        run: limactl shell probe -- uname -a || echo "::warning::VM shell unavailable — nested virtualization likely unsupported"
