# Release via Trusted Publishing (OIDC — no API token stored anywhere).
#
# Two ways to run:
#   1. Publishing a GitHub Release for a v* tag  -> builds + publishes to PyPI.
#   2. Actions -> "release" -> Run workflow      -> builds + publishes to TestPyPI
#      from the current ref. Use this to rehearse the whole pipeline without
#      cutting a real tag. Production PyPI is ONLY reachable via a Release (1),
#      which enforces the tag==version guard.
#
# One-time setup on each index (pypi.org AND test.pypi.org): add a trusted
# publisher for project "rosmac" — owner PythonToGo, repo rosmac,
# workflow release.yml, environment pypi.
# The "pypi" GitHub environment must allow the v* tag (for 1) and the main
# branch (for 2) under its deployment branch/tag policy.
name: release
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard — tag must match the package version
        if: github.event_name == 'release'
        run: |
          # version single source: src/rosmac/__init__.py (P5.1, D12)
          PKG_VER=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/rosmac/__init__.py').read()).group(1))")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG_VER" != "$TAG" ]; then
            echo "::error::tag v$TAG != package version $PKG_VER — bump src/rosmac/__init__.py first"
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Smoke — install the built wheel in a clean venv and run the CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/rosmac --help
          /tmp/smoke/bin/rosmac --version
          if [ "${{ github.event_name }}" = "release" ]; then
            INSTALLED=$(/tmp/smoke/bin/rosmac --version | awk '{print $NF}')
            TAG=${GITHUB_REF_NAME#v}
            if [ "$INSTALLED" != "$TAG" ]; then
              echo "::error::installed wheel reports $INSTALLED, tag is v$TAG"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/rosmac' || 'https://test.pypi.org/p/rosmac' }}
    permissions:
      id-token: write # OIDC — the only credential Trusted Publishing needs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Release -> production PyPI (default). Manual dispatch -> TestPyPI rehearsal.
          repository-url: ${{ github.event_name == 'release' && '' || 'https://test.pypi.org/legacy/' }}
